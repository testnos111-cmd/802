<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HB SERVER</title>
    <script>
    function toggleMenu() {
        var x = document.getElementsByTagName("nav")[0];
        if (x.className === "responsive") {
            x.className = "";
        } else {
            x.className = "responsive";
        }
    }
  
    async function login(){
      var token = document.querySelectorAll("input")[0]

      
      if(token.value.length == 32){
        var res = await fetch(`/v1/login.json?access_token=${token.value}`,{
            method:"GET",
            headers:{},
        })
        
        try {
            var result = await res.json()
        } catch (error) {
            alert("올바르지 않은 TOKEN 입니다.") 
        }
        
        if(result.status == 0){
            location.replace(`kakao://appauth?access_token=${encodeURIComponent(result.data.token || token.value)}&refresh_token=${encodeURIComponent(result.data.refresh_token || result.data.token || token.value)}&expires_in=${result.data.expires_in || 315360000}`)
        } else {
            alert("올바르지 않은 TOKEN 입니다.")
        }

      } else {
        alert("올바르지 않은 TOKEN 입니다.")
      }
    }
  
    function register() {
        if(confirm('회원가입 하시겠습니까?')) {
            location.href='./register.html' 
        } else {

        }
    }
    </script>
